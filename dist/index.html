<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locard: learn digital forensics and incident response</title>
<meta name="description" content="Twelve hands-on labs that teach how digital forensics and incident response actually work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

/* ============ tokens ============ */
:root {
  --font: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --bg: #eff1f4; --bg-2: #e6e9ee; --surface: #ffffff; --surface-2: #f2f4f7;
  --line: #dde1e7; --line-2: #c6ccd5;
  --text: #13161b; --muted: #515964; --faint: #838b97;
  --accent: #8f5b00; --accent-2: #774b00; --accent-soft: #c07a0017; --accent-line: #b0700066; --accent-ink: #ffffff; --tape: #f2b632;
  --ok: #1b7549; --ok-soft: #1b754916; --ok-line: #1b754955;
  --bad: #b3372f; --bad-soft: #b3372f14;
  --shadow: 0 1px 0 #ffffff inset, 0 18px 40px -26px #13161b55;
  --grid: #13161b0c;
  --r-lg: 14px; --r-md: 10px; --r-sm: 6px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1114; --bg-2: #14171b; --surface: #171a1f; --surface-2: #1e2227;
    --line: #292e35; --line-2: #3a4049;
    --text: #e8ebee; --muted: #9ea5af; --faint: #6b727c;
    --accent: #e8ab40; --accent-2: #f2c26d; --accent-soft: #e8ab401c; --accent-line: #e8ab4055; --accent-ink: #1c1303; --tape: #e8ab40;
    --ok: #55c38f; --ok-soft: #55c38f1a; --ok-line: #55c38f55;
    --bad: #ec7a70; --bad-soft: #ec7a701c;
    --shadow: 0 1px 0 #ffffff08 inset, 0 22px 50px -28px #000000;
    --grid: #ffffff08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
--bg: #0f1114; --bg-2: #14171b; --surface: #171a1f; --surface-2: #1e2227;
  --line: #292e35; --line-2: #3a4049;
  --text: #e8ebee; --muted: #9ea5af; --faint: #6b727c;
  --accent: #e8ab40; --accent-2: #f2c26d; --accent-soft: #e8ab401c; --accent-line: #e8ab4055; --accent-ink: #1c1303; --tape: #e8ab40;
  --ok: #55c38f; --ok-soft: #55c38f1a; --ok-line: #55c38f55;
  --bad: #ec7a70; --bad-soft: #ec7a701c;
  --shadow: 0 1px 0 #ffffff08 inset, 0 22px 50px -28px #000000;
  --grid: #ffffff08;
  color-scheme: dark;
}

/* ============ base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font: 16px/1.62 var(--font);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, var(--line-2) 1px, transparent 0);
  background-size: 24px 24px; opacity: .45;
  -webkit-mask-image: linear-gradient(160deg, #000 0%, transparent 55%); mask-image: linear-gradient(160deg, #000 0%, transparent 55%);
}
img, svg, canvas { max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
p { margin: 0; }
code, kbd, .mono { font-family: var(--mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }
.ic { flex: none; display: block; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--surface); padding: 8px 14px; border-radius: 8px; }
.skip:focus { left: 12px; }

/* ============ shell ============ */
.shell { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; overscroll-behavior: contain;
  border-right: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 70%, var(--surface));
  padding: 22px 16px 28px; display: flex; flex-direction: column; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; padding: 2px 6px; }
.brand-mark { color: var(--accent); display: grid; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; }
.brand-txt b { font-size: 1.02rem; font-weight: 650; letter-spacing: -.02em; }
.brand-txt small { color: var(--muted); font-size: .78rem; }
.side-progress { padding: 0 6px; display: grid; gap: 7px; font-size: .8rem; color: var(--muted); }
.meter { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.side nav { display: flex; flex-direction: column; gap: 18px; }
.nav-head { display: flex; align-items: center; gap: 9px; padding: 7px 8px; text-decoration: none; font-weight: 600; border-radius: 8px; }
.nav-head .ic { color: var(--accent); }
.nav-head em { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: .74rem; color: var(--faint); }
.nav-track ol { list-style: none; margin: 4px 0 0; padding: 0 0 0 12px; border-left: 1px solid var(--line); margin-left: 16px; }
.nav-track li a { display: flex; align-items: center; gap: 10px; padding: 6px 8px; text-decoration: none; color: var(--muted); font-size: .9rem; border-radius: 8px; }
.nav-dot { width: 20px; height: 20px; border-radius: 99px; border: 1px solid var(--line-2); display: grid; place-items: center; font-family: var(--mono); font-size: .68rem; color: var(--faint); flex: none; }
.nav-track li a.is-done .nav-dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.side a:not(.brand):hover { background: var(--surface-2); color: var(--text); }
.side a.brand[aria-current="page"] { background: none; box-shadow: none; }
.side a:not(.brand)[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.side a[aria-current="page"] .nav-dot { border-color: var(--accent); color: var(--accent); }
.nav-more { display: grid; gap: 2px; padding-top: 14px; border-top: 1px solid var(--line); }
.nav-more a { padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: .92rem; }
.topbar { display: none; }
.scrim { display: none; }
main#view { outline: none; min-width: 0; }

@media (max-width: 920px) {
  .shell { grid-template-columns: 1fr; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; margin-top: calc(-1 * env(safe-area-inset-top, 0px));
    background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .side {
    position: fixed; z-index: 50; top: 0; left: 0; bottom: 0; height: auto; width: min(320px, 86vw);
    padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-102%); transition: transform .32s cubic-bezier(.2,.8,.2,1); background: var(--bg); box-shadow: var(--shadow);
  }
  body.nav-open .side { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: #00000055; opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
}
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 10px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; }

/* ============ page + type ============ */
.page { max-width: 1140px; margin: 0 auto; padding: clamp(24px, 4.5vw, 60px) clamp(18px, 4vw, 56px) 80px; }
.lede { font-size: clamp(1.05rem, 1.4vw, 1.2rem); color: var(--muted); max-width: 60ch; line-height: 1.55; }
.prose { max-width: 64ch; }
.prose h2 { font-size: 1.45rem; margin: 40px 0 12px; }
.prose h2:first-child { margin-top: 0; }
.prose h3 { font-size: 1.1rem; margin: 26px 0 8px; }
.prose p { margin: 0 0 14px; color: color-mix(in srgb, var(--text) 88%, var(--muted)); }
.prose ul, .prose ol { padding-left: 1.2em; margin: 0 0 16px; }
.prose li { margin: 4px 0; }
.prose strong { font-weight: 600; color: var(--text); }
.prose code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); }
.muted { color: var(--muted); }

/* ============ buttons + controls ============ */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface);
  font-weight: 500; font-size: .93rem; cursor: pointer; text-decoration: none; line-height: 1.2;
  transition: background .15s, border-color .15s, transform .12s;
}
.btn:hover { border-color: var(--faint); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.985); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.lg { padding: 13px 20px; font-size: 1rem; border-radius: 12px; }

.ctl { display: grid; gap: 6px; }
.ctl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: .9rem; }
.ctl-top label { color: var(--muted); }
.ctl-top output { font-family: var(--mono); font-size: .88rem; color: var(--text); }
input[type=range] {
  --p: 50%; -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; cursor: pointer; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, var(--accent) var(--p), var(--line-2) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 99px; background: var(--line-2); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 99px; background: var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 4px #0003; transition: transform .12s; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-size: .88rem; color: var(--muted); cursor: pointer; font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line-2), 0 2px 6px -3px #0004; }
.seg.full { display: flex; } .seg.full button { flex: 1; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .92rem; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .knob { width: 36px; height: 21px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .2s; flex: none; }
.switch .knob i { position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); transition: transform .22s cubic-bezier(.3,1.4,.5,1); box-shadow: 0 1px 2px #0004; }
.switch input:checked + .knob { background: var(--accent); }
.switch input:checked + .knob i { transform: translateX(15px); }
.switch input:focus-visible + .knob { outline: 2px solid var(--accent); outline-offset: 2px; }

input[type=text], input[type=search], textarea, select {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; width: 100%;
}
input[type=text]:focus, input[type=search]:focus, select:focus { outline: 2px solid var(--accent-line); border-color: var(--accent); }
.field { display: grid; gap: 6px; }
.field label { font-size: .88rem; color: var(--muted); }
.field .help { font-size: .8rem; color: var(--faint); }
.field .err { font-size: .82rem; color: var(--bad); }

/* ============ lesson layout ============ */
.lesson-head { display: grid; gap: 16px; margin-bottom: 30px; }
.lesson-head h1 { font-size: clamp(2.1rem, 4.6vw, 3.5rem); letter-spacing: -0.035em; line-height: 1.02; max-width: 17ch; font-weight: 650; }
.crumb { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; color: var(--faint); }
.crumb a { color: var(--accent); text-decoration: none; font-weight: 500; }
.crumb span + span::before, .crumb a + span::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); margin-right: 16px; vertical-align: middle; }

.lab {
  margin: 0 0 48px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); overflow: hidden;
}
.lab-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(270px, 1fr); min-width: 0; }
.lab-stage {
  position: relative; min-height: 300px; padding: 18px; min-width: 0;
  background-color: var(--surface-2);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px; background-position: -1px -1px;
  border-right: 1px solid var(--line);
}
.lab-stage > svg { display: block; width: 100%; height: auto; }
.lab-stage > canvas { display: block; width: 100%; }
.stage-hint { position: absolute; left: 18px; bottom: 12px; font-size: .8rem; color: var(--faint); }
.lab-panel { padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.lab-panel h3 { font-size: 1rem; }
.lab-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.lab-bar .spacer { flex: 1; }
.lab-foot { display: flex; flex-wrap: wrap; gap: 10px 20px; padding: 14px 18px; border-top: 1px solid var(--line); font-size: .9rem; color: var(--muted); }
@media (max-width: 860px) {
  .lab-grid { grid-template-columns: minmax(0, 1fr); }
  .lab-stage { border-right: 0; border-bottom: 1px solid var(--line); }
}

.readouts { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px; font-size: .9rem; }
.ro + .ro { border-top: 1px solid var(--line); }
.ro span { color: var(--muted); }
.ro b { font-family: var(--mono); font-weight: 500; font-size: .95rem; text-align: right; }
.ro.status b { font-family: var(--font); font-weight: 600; }
.ro.good b { color: var(--ok); }
.ro.bad b { color: var(--bad); }
.big-read { font-family: var(--mono); font-size: 2.1rem; letter-spacing: -0.03em; line-height: 1; }

.read { display: grid; grid-template-columns: minmax(0, 64ch) minmax(200px, 1fr); gap: 56px; align-items: start; }
.notes { display: grid; gap: 22px; position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); }
.note { border-left: 2px solid var(--accent); padding-left: 14px; }
.note b { display: block; font-family: var(--mono); font-weight: 500; font-size: 1.25rem; letter-spacing: -0.02em; }
.note p { color: var(--muted); font-size: .9rem; line-height: 1.5; }
@media (max-width: 1000px) {
  .read { grid-template-columns: 1fr; gap: 32px; }
  .notes { position: static; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
}
.takeaways { margin-top: 48px; padding: 26px 28px; border-radius: var(--r-lg); background: var(--accent-soft); border: 1px solid var(--accent-line); max-width: 820px; }
.takeaways h2 { font-size: 1.1rem; margin-bottom: 10px; }
.takeaways ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.takeaways li { padding-left: 22px; position: relative; }
.takeaways li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 9px; height: 2px; background: var(--accent); }

.lesson-foot { margin-top: 56px; padding-top: 26px; border-top: 1px solid var(--line); display: grid; gap: 22px; }
.done-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pager-link { display: grid; gap: 3px; padding: 16px 18px; border-radius: var(--r-md); border: 1px solid var(--line); text-decoration: none; background: var(--surface); transition: border-color .15s; }
.pager-link:hover { border-color: var(--accent-line); }
.pager-link small { color: var(--faint); font-size: .8rem; }
.pager-link span { font-weight: 550; }
.pager-link.to-next { text-align: right; grid-column: 2; }
@media (max-width: 600px) { .pager { grid-template-columns: 1fr; } .pager-link.to-next { grid-column: 1; } }

/* ============ sequence diagram ============ */
.seq { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(250px, 1fr); }
.seq-stage { max-height: 520px; overflow-y: auto; padding: 16px; background-color: var(--surface-2); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; border-right: 1px solid var(--line); }
.seq-svg { width: 100%; height: auto; display: block; font-family: var(--font); }
.seq-actor rect { fill: var(--surface); stroke: var(--line-2); }
.seq-actor text { fill: var(--text); font-size: 13.5px; font-weight: 600; }
.seq-actor .life { stroke: var(--line-2); stroke-dasharray: 3 5; }
.seq-actor.evil rect { stroke: var(--bad); }
.seq-actor.evil text { fill: var(--bad); }
.seq-msg line { stroke: var(--faint); stroke-width: 1.5; }
.seq-msg path { fill: var(--faint); }
.seq-msg text { fill: var(--muted); font-size: 12.5px; }
.seq-msg.cur line { stroke: var(--accent); stroke-width: 2; }
.seq-msg.cur path { fill: var(--accent); }
.seq-msg.cur text { fill: var(--text); font-weight: 600; }
.seq-msg.bad.cur line, .seq-msg.bad line { stroke: var(--bad); }
.seq-msg.bad path { fill: var(--bad); }
.seq-msg line.draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .55s cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.seq-self rect { fill: var(--surface); stroke: var(--line-2); }
.seq-self text { fill: var(--muted); font-size: 11.5px; }
.seq-self.cur rect { stroke: var(--accent); fill: var(--accent-soft); }
.seq-self.cur text { fill: var(--text); font-weight: 600; }
.seq-self.bad rect { stroke: var(--bad); } .seq-self.bad.cur rect { fill: var(--bad-soft); }
.seq-side { padding: 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.seq-count { font-family: var(--mono); font-size: .8rem; color: var(--faint); }
.seq-title { font-size: 1.15rem; }
.seq-note { color: var(--muted); font-size: .94rem; }
.seq-extra:empty { display: none; }
.seq-ctl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 14px; }
@media (max-width: 860px) { .seq { grid-template-columns: 1fr; } .seq-stage { border-right: 0; border-bottom: 1px solid var(--line); max-height: 380px; } }

/* ============ home ============ */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: clamp(28px, 5vw, 64px); align-items: center; min-height: min(82dvh, 760px); padding-top: clamp(8px, 2vw, 24px); }
.hero h1 { font-size: clamp(2.4rem, 4.8vw, 4rem); line-height: 1; letter-spacing: -0.045em; font-weight: 650; max-width: 13ch; text-wrap: balance; }
.hero .lede { margin-top: 22px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
@media (max-width: 980px) { .hero { grid-template-columns: 1fr; min-height: 0; } }

.ruler { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
.ruler-top { padding: 20px 22px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ruler-top .dist { font-family: var(--mono); font-size: clamp(2.4rem, 5vw, 3.4rem); letter-spacing: -0.04em; line-height: .9; }
.ruler-top .obj { color: var(--muted); font-size: .95rem; text-align: right; max-width: 22ch; }
.ruler-svg { display: block; width: 100%; height: auto; touch-action: none; cursor: ew-resize; }
.ruler-svg .tick { stroke: var(--line-2); }
.ruler-svg .tick.major { stroke: var(--faint); }
.ruler-svg text { fill: var(--faint); font-family: var(--mono); font-size: 11px; }
.ruler-svg .band-label { fill: var(--text); font-family: var(--font); font-size: 12.5px; font-weight: 600; }
.ruler-svg .handle-line { stroke: var(--text); stroke-width: 1.5; }
.ruler-svg .handle-knob { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }
.ruler-out { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.ruler-out > div { padding: 16px 22px 20px; display: grid; gap: 4px; align-content: start; }
.ruler-out > div + div { border-left: 1px solid var(--line); }
.ruler-out h3 { font-size: .95rem; display: flex; gap: 8px; align-items: center; }
.ruler-out .state { font-weight: 600; font-size: 1.02rem; }
.ruler-out .state.on { color: var(--accent); }
.ruler-out .state.off { color: var(--faint); }
.ruler-out p { color: var(--muted); font-size: .88rem; line-height: 1.45; }
.ruler-slider { padding: 0 22px 12px; }
@media (max-width: 520px) { .ruler-out { grid-template-columns: 1fr; } .ruler-out > div + div { border-left: 0; border-top: 1px solid var(--line); } }

.section { margin-top: clamp(56px, 8vw, 100px); }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
.section-head h2 { font-size: clamp(1.6rem, 3vw, 2.3rem); letter-spacing: -0.03em; max-width: 20ch; }
.section-head p { color: var(--muted); max-width: 46ch; }

.tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line); }
.track-col { padding: 26px 0 0; }
.track-col + .track-col { padding-left: 40px; border-left: 1px solid var(--line); }
.track-col:first-child { padding-right: 40px; }
.track-col header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.track-col header .ic { color: var(--accent); }
.track-col header h3 { font-size: 1.35rem; }
.track-col header em { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: .8rem; color: var(--faint); }
.track-col > p { color: var(--muted); margin-bottom: 16px; max-width: 48ch; }
.lesson-list { list-style: none; padding: 0; margin: 0; }
.lesson-list li a { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: center; padding: 13px 4px; border-top: 1px solid var(--line); text-decoration: none; }
.lesson-list li:last-child a { border-bottom: 1px solid var(--line); }
.lesson-list li a:hover .ll-title { color: var(--accent); }
.ll-num { font-family: var(--mono); font-size: .82rem; color: var(--faint); }
.ll-title { font-weight: 550; transition: color .15s; }
.ll-meta { font-size: .82rem; color: var(--faint); display: flex; align-items: center; gap: 8px; }
.ll-meta .ic { color: var(--accent); }
@media (max-width: 820px) { .tracks { grid-template-columns: 1fr; } .track-col + .track-col { padding-left: 0; border-left: 0; margin-top: 30px; } .track-col:first-child { padding-right: 0; } }

.videos { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 720px) { .videos { grid-template-columns: 1fr; } }
.video { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; padding: 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); text-decoration: none; transition: border-color .15s, transform .15s; }
.video:hover { border-color: var(--accent-line); }
.video:active { transform: scale(.995); }
.video-art { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; }
.video-art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.video-play { position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px -6px var(--accent); }
.video-play .ic { margin-left: 2px; fill: currentColor; }
.video-meta { display: grid; gap: 4px; }
.video-meta b { font-weight: 600; font-size: 1.02rem; }
.video-meta > span { color: var(--muted); font-size: .9rem; line-height: 1.45; }
.video-meta .video-link { color: var(--accent); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; }
@media (max-width: 460px) { .video { grid-template-columns: 1fr; } }

.tools-row { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tools-row a { padding: 22px 20px 24px; text-decoration: none; display: grid; gap: 6px; }
.tools-row a + a { border-left: 1px solid var(--line); }
.tools-row a:hover { background: var(--surface); }
.tools-row b { font-size: 1.05rem; font-weight: 600; }
.tools-row span { color: var(--muted); font-size: .92rem; }
@media (max-width: 720px) { .tools-row { grid-template-columns: 1fr; } .tools-row a + a { border-left: 0; border-top: 1px solid var(--line); } }

.site-foot { margin-top: 80px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; color: var(--faint); font-size: .85rem; }
.site-foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: .85rem; }

/* track overview */
.track-hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 48px; align-items: end; margin-bottom: 44px; }
.track-hero h1 { font-size: clamp(2.6rem, 6vw, 4.8rem); letter-spacing: -0.05em; line-height: .95; font-weight: 650; }
.track-hero .full { color: var(--faint); font-size: 1rem; margin-top: 10px; }
@media (max-width: 860px) { .track-hero { grid-template-columns: 1fr; gap: 24px; } }

/* ============ generic bits ============ */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: .78rem; border: 1px solid var(--line-2); color: var(--muted); background: var(--surface); }
.chip.on { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }
.chip.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.callout { padding: 14px 16px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--line); font-size: .92rem; color: var(--muted); }
.callout.good { background: var(--ok-soft); border-color: var(--ok-line); color: var(--text); }
.callout.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--text); }
.callout b { color: var(--text); }
.empty { text-align: left; max-width: 640px; }
.empty h1 { font-size: 2.4rem; margin-bottom: 12px; }
.empty p { color: var(--muted); margin-bottom: 22px; }
.table-wrap { position: relative; overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
table.spec { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .94rem; }
table.spec th, table.spec td { text-align: left; padding: 13px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.spec thead th { font-size: .85rem; color: var(--muted); font-weight: 500; background: var(--surface-2); }
table.spec tbody th { font-weight: 550; color: var(--muted); width: 26%; }
table.spec tr:last-child > * { border-bottom: 0; }
table.spec td.hl { color: var(--accent); font-weight: 550; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
@media (max-width: 520px) {
  .ruler-top .obj { text-align: left; }
  .ruler-svg text { font-size: 17px; }
  .ruler-svg .band-label { font-size: 18px; }
}
/* ============ shared ============ */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.small { font-size: .84rem; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.toggles { display: grid; gap: 10px; }
.btn.sm { padding: 6px 11px; font-size: .85rem; border-radius: 8px; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn.danger:hover { background: var(--bad-soft); }
.icon-btn.sm { width: 26px; height: 26px; border-radius: 7px; }
.mono { font-family: var(--mono); }
.ok-t { color: var(--ok); } .bad-t { color: var(--bad); }
.pn { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-2); font: 600 .72rem var(--mono); flex: none; }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
.seq-banner rect { fill: var(--surface); stroke: var(--line-2); stroke-dasharray: 4 4; }
.seq-banner.cur text { fill: var(--text); font-weight: 600; } .seq-banner text { fill: var(--muted); font-size: 12px; }
.tracks.three { grid-template-columns: 1fr 1fr 1fr; }
.tracks.three .track-col + .track-col { padding-left: 32px; } .tracks.three .track-col:first-child { padding-right: 0; } .tracks.three .track-col { padding-left: 32px; }
.tracks.three .track-col:first-child { padding-left: 0; }
@media (max-width: 940px) { .tracks.three { grid-template-columns: 1fr; } .tracks.three .track-col { padding-left: 0 !important; border-left: 0; margin-top: 26px; } .tracks.three .track-col:first-child { margin-top: 0; } }
.track-covers { align-self: end; padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.track-covers > p:last-child { font-weight: 550; margin-top: 4px; }
.track-hero .full { color: var(--accent); font-weight: 600; font-size: .82rem; letter-spacing: .02em; margin-bottom: 6px; text-transform: uppercase; }
.chg { color: var(--accent) !important; font-weight: 600; background: var(--accent-soft); }

/* ============ evidence tag (hero) ============ */
.etag { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); transition: box-shadow .3s; }
.etag.broken { box-shadow: 0 0 0 1px var(--bad), var(--shadow); }
.tape { display: flex; gap: 22px; background: var(--tape); color: #1c1303; font: 700 .7rem/2.4 var(--mono); letter-spacing: .18em; padding: 0 14px; white-space: nowrap; overflow: hidden; }
.tape span::after { content: "·"; margin-left: 22px; opacity: .5; }
.etag-body { padding: 18px 20px 20px; display: grid; gap: 14px; }
.etag-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; margin: 0; }
.etag-meta div { display: flex; gap: 8px; align-items: baseline; font-size: .82rem; min-width: 0; }
.etag-meta dt { color: var(--faint); font-family: var(--mono); text-transform: uppercase; font-size: .68rem; letter-spacing: .04em; flex: none; }
.etag-meta dd { margin: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.etag-label { font-size: .8rem; color: var(--muted); }
.etag-text { font-family: var(--mono); font-size: .82rem; line-height: 1.5; resize: vertical; min-height: 96px; }
.etag-hashes { display: grid; gap: 8px; }
.etag-hashes > div { display: grid; gap: 2px; }
.etag-hashes small { font-size: .72rem; color: var(--faint); }
.hx { font-family: var(--mono); font-size: .74rem; word-break: break-all; line-height: 1.5; color: var(--muted); }
.hx mark { background: var(--bad-soft); color: var(--bad); font-weight: 700; border-radius: 2px; }
.hx.now mark { background: var(--bad); color: #fff; }
.etag-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: .88rem; color: var(--muted); }
.verdict { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.hero-tag { min-width: 0; }

/* ============ lifecycle deck ============ */
.deck { display: grid; gap: 0; }
.deck-top { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0; border-bottom: 1px solid var(--line); }
.deck-card { padding: 22px; min-height: 190px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.deck-count { font: .78rem var(--mono); color: var(--faint); }
.deck-text { font-size: 1.12rem; font-weight: 500; line-height: 1.4; }
.deck-choose { padding: 22px; }
.phase-btns { display: grid; gap: 8px; margin-top: 10px; }
.phase-btns .btn { justify-content: flex-start; text-align: left; }
.phase-btns .btn.picked { border-color: var(--accent); }
.deck-done { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
.deck-done .big-read { grid-row: span 2; }
.deck-done .btn { grid-column: 2; justify-self: start; }
.lanes { display: grid; grid-template-columns: repeat(4, 1fr); }
.lane { padding: 14px; border-right: 1px solid var(--line); min-height: 120px; }
.lane:last-child { border-right: 0; }
.lane h3 { font-size: .9rem; display: flex; align-items: center; gap: 7px; }
.lane-csf { font-size: .68rem; color: var(--faint); font-family: var(--mono); margin: 4px 0 10px; }
.lane ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lane li { display: grid; grid-template-columns: 16px 1fr; gap: 7px; font-size: .78rem; padding: 7px 9px; border-radius: 8px; background: var(--surface-2); align-items: start; }
.lane li .ic { margin-top: 2px; } .lane li.ok .ic { color: var(--ok); } .lane li.miss .ic { color: var(--bad); }
@media (max-width: 860px) { .deck-top { grid-template-columns: 1fr; } .deck-card { border-right: 0; border-bottom: 1px solid var(--line); } .lanes { grid-template-columns: 1fr 1fr; } .lane:nth-child(2n) { border-right: 0; } }

/* ============ volatility ============ */
.clock { color: var(--muted); }
.vol-list { list-style: none; margin: 0; padding: 0; }
.vol { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(80px, 150px) 44px auto; gap: 12px; align-items: center; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); margin-bottom: 7px; cursor: grab; }
.vol.dragging { opacity: .5; } .vol.over { border-color: var(--accent); border-style: dashed; }
.vol-n { width: 26px; height: 26px; display: grid; place-items: center; background: var(--surface-2); border-radius: 7px; font: 600 .8rem var(--mono); color: var(--muted); }
.vol-name { font-weight: 500; font-size: .92rem; }
.vol-bar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.vol-bar i { display: block; height: 100%; background: var(--ok); transition: width .1s linear; }
.vol-bar i.mid { background: var(--tape); } .vol-bar i.lo { background: var(--bad); }
.vol-pct { font-size: .8rem; color: var(--muted); text-align: right; }
.vol-move { display: flex; gap: 3px; }
.vol-result, .deck-done { display: flex; gap: 16px; align-items: center; }
.vol-result .big-read, .del-result .big-read { color: var(--text); }
@media (max-width: 620px) { .vol { grid-template-columns: 26px 1fr 40px; } .vol-bar, .vol-pct { display: none; } }

/* ============ hashing ============ */
.hash-stage { display: flex; flex-direction: column; }
.hash-stage textarea { font-family: var(--mono); font-size: .86rem; width: 100%; min-height: 150px; resize: vertical; }
.drop { display: grid; gap: 4px; place-items: center; text-align: center; padding: 30px 16px; border: 1.5px dashed var(--line-2); border-radius: var(--r-md); cursor: pointer; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.hash-out { display: grid; gap: 12px; }
.hrow { display: grid; gap: 5px; }
.hrow-top { display: flex; justify-content: space-between; align-items: baseline; }
.aval { display: block; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.aval i { display: block; height: 100%; background: var(--bad); }
.custody { border-top: 1px solid var(--line); padding: 20px 18px; min-width: 0; overflow: hidden; }
.custody-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.custody-head h3 { font-size: 1.05rem; }
.custody-t td { font-size: .85rem; } .custody-t tr.hit td { background: var(--bad-soft); } .custody-t tr.missed td { background: color-mix(in srgb, var(--tape) 12%, transparent); } .custody-t tr.false td { background: var(--surface-2); }
.custody-t tr.explain td { font-size: .82rem; color: var(--muted); padding-top: 4px; }
.custody-t tr.explain.hit td, .custody-t tr.explain.missed td { color: var(--text); }
.flag-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.flag-btn[aria-pressed="true"] { border-color: var(--tape); color: var(--text); background: color-mix(in srgb, var(--tape) 15%, transparent); }
.flag-btn .ic { color: var(--tape); }
.custody-out { margin-top: 12px; }

/* ============ imaging ============ */
.img-stage { display: flex; flex-direction: column; gap: 12px; }
.sectors { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
.sec { aspect-ratio: 1; border-radius: 3px; background: var(--surface); border: 1px solid var(--line-2); }
.sec.s-u { background: var(--surface); } .sec.s-r { background: var(--ok-soft); border-color: var(--ok-line); } .sec.s-w { background: var(--bad); border-color: var(--bad); } .sec.s-wr { background: var(--bad); border-color: var(--bad); opacity: .7; }
.sect-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .78rem; color: var(--muted); }
.sect-legend span { display: inline-flex; align-items: center; gap: 7px; }
.sect-legend i { width: 13px; height: 13px; border-radius: 3px; border: 1px solid var(--line-2); }
.k-u { background: var(--surface); } .k-r { background: var(--ok-soft); border-color: var(--ok-line) !important; } .k-w { background: var(--bad); border-color: var(--bad) !important; }
.k-a { background: var(--accent-soft); border-color: var(--accent-line) !important; } .k-d { background: color-mix(in srgb, var(--tape) 40%, var(--surface)); border-color: var(--tape) !important; } .k-z { background: var(--surface-2); } .k-e { background: var(--surface); border-style: dashed !important; }
.img-log, .del-log { list-style: none; margin: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); font: .78rem/1.5 var(--mono); max-height: 150px; overflow-y: auto; display: grid; gap: 4px; color: var(--muted); }
.img-log li.bad, .del-log li.bad { color: var(--bad); }
.img-steps { display: grid; gap: 8px; }
.img-steps .btn { justify-content: flex-start; }
.fmt-f { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .84rem; color: var(--muted); }
.fmt-f li { padding-left: 16px; position: relative; } .fmt-f li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.fmt-size { padding-left: 0 !important; display: flex; gap: 8px; align-items: baseline; } .fmt-size::before { display: none; } .fmt-size b { font: 500 1.2rem var(--mono); color: var(--text); }

/* ============ deleted files ============ */
.del-stage { display: flex; flex-direction: column; gap: 12px; }
.clusters { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
.clu { aspect-ratio: 1; border-radius: 3px; border: 1px solid var(--line-2); }
.clu.c-a { background: var(--accent-soft); border-color: var(--accent-line); } .clu.c-d { background: color-mix(in srgb, var(--tape) 35%, var(--surface)); border-color: var(--tape); } .clu.c-z { background: var(--surface-2); } .clu.c-e { border-style: dashed; background: var(--surface); }
.clu.c-a.hue-1 { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); } .clu.c-a.hue-2 { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); border-color: var(--ok-line); } .clu.c-a.hue-3 { background: color-mix(in srgb, #6b8cc9 24%, var(--surface)); } .clu.c-a.hue-4 { background: color-mix(in srgb, #b07bd0 22%, var(--surface)); } .clu.c-a.hue-5 { background: color-mix(in srgb, #d08a5a 24%, var(--surface)); }
.clu.hl { outline: 2px solid var(--text); outline-offset: 1px; }
.mft { display: grid; gap: 7px; }
.rec { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.rec.empty { color: var(--faint); background: var(--surface-2); border-style: dashed; }

  /* ---------- sequence diagram player (used by several labs) ---------- */
  App.seq = function (host, opts) {
    let steps = opts.steps, i = 0, timer = null;
    const actors = opts.actors;
    host.innerHTML = `
      <div class="seq">
        <div class="seq-stage"><svg class="seq-svg" role="img" aria-label="${App.esc(opts.label || 'Message sequence')}"></svg></div>
        <div class="seq-side">
          <div class="seq-count" aria-live="polite"></div>
          <h3 class="seq-title"></h3>
          <p class="seq-note"></p>
          <div class="seq-extra"></div>
          <div class="seq-ctl">
            <button type="button" class="btn" data-a="back">${App.icon('prev', 16)}Back</button>
            <button type="button" class="btn primary" data-a="next">Next step${App.icon('next', 16)}</button>
            <button type="button" class="btn ghost" data-a="play">${App.icon('play', 16)}Play</button>
            <button type="button" class="btn ghost" data-a="reset">${App.icon('reset', 16)}Restart</button>
          </div>
        </div>
      </div>`;
    const svg = host.querySelector('.seq-svg'), stage = host.querySelector('.seq-stage');
    const W = 640, top = 66, rowH = 46;
    const ax = (id) => { const k = actors.findIndex((a) => a.id === id); const n = actors.length; return n === 1 ? W / 2 : 82 + k * ((W - 164) / (n - 1)); };
    const stop = () => { if (timer) { clearInterval(timer); timer = null; } host.querySelector('[data-a=play]').innerHTML = App.icon('play', 16) + 'Play'; };
    App.own(stop);

    function draw() {
      const n = steps.length, H = top + n * rowH + 20;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      let s = '';
      actors.forEach((a) => {
        const x = ax(a.id);
        s += `<g class="seq-actor ${a.cls || ''}"><line class="life" x1="${x}" y1="44" x2="${x}" y2="${H - 6}"/><rect x="${x - 66}" y="8" width="132" height="36" rx="9"/><text x="${x}" y="31" text-anchor="middle">${App.esc(a.label)}</text></g>`;
      });
      steps.forEach((st, k) => {
        if (k > i) return;
        const y = top + k * rowH + 20, state = k < i ? 'past' : 'cur';
        if (st.banner) {
          s += `<g class="seq-banner ${state} ${st.tone || ''}"><rect x="18" y="${y - 15}" width="${W - 36}" height="28" rx="7"/><text x="${W / 2}" y="${y + 4}" text-anchor="middle">${App.esc(st.short || st.msg)}</text></g>`;
        } else if (st.self) {
          [].concat(st.self).forEach((id) => {
            const x = ax(id);
            s += `<g class="seq-self ${state} ${st.tone || ''}"><rect x="${x - 62}" y="${y - 15}" width="124" height="28" rx="7"/><text x="${x}" y="${y + 4}" text-anchor="middle">${App.esc(st.short || st.msg)}</text></g>`;
          });
        } else {
          const x1 = ax(st.from), x2 = ax(st.to), dir = x2 > x1 ? 1 : -1;
          s += `<g class="seq-msg ${state} ${st.tone || ''}"><line class="${state === 'cur' && !App.reduced ? 'draw' : ''}" x1="${x1 + dir * 4}" y1="${y}" x2="${x2 - dir * 10}" y2="${y}"/><path d="M${x2 - dir * 11} ${y - 5}L${x2 - dir * 2} ${y}L${x2 - dir * 11} ${y + 5}z"/><text x="${(x1 + x2) / 2}" y="${y - 8}" text-anchor="middle">${App.esc(st.msg)}</text></g>`;
        }
      });
      svg.innerHTML = s;
      const st = steps[i];
      host.querySelector('.seq-count').textContent = `Step ${i + 1} of ${n}`;
      host.querySelector('.seq-title').textContent = st.title || st.msg;
      host.querySelector('.seq-note').innerHTML = st.note || '';
      const extra = host.querySelector('.seq-extra');
      extra.innerHTML = '';
      if (opts.onStep) opts.onStep(i, st, extra, steps);
      host.querySelector('[data-a=back]').disabled = i === 0;
      const blocked = st.gate && !st.resolved;
      host.querySelector('[data-a=next]').disabled = i >= n - 1 || blocked;
      if (i >= n - 1 || blocked) stop();
      const yCur = ((top + i * rowH) / H) * svg.getBoundingClientRect().height;
      if (stage.scrollHeight > stage.clientHeight) stage.scrollTo({ top: Math.max(0, yCur - stage.clientHeight / 2), behavior: App.reduced ? 'auto' : 'smooth' });
    }
    const api = {
      go(k) { i = App.clamp(k, 0, steps.length - 1); draw(); },
      next() { api.go(i + 1); },
      get index() { return i; },
      set(newSteps, keep) { steps = newSteps; i = keep ? Math.min(i, steps.length - 1) : 0; draw(); },
      steps: () => steps,
      redraw: draw,
      stop
    };
    host.querySelector('.seq-ctl').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-a]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'next') { stop(); api.next(); }
      if (a === 'back') { stop(); api.go(i - 1); }
      if (a === 'reset') { stop(); if (opts.onReset) opts.onReset(); else api.go(0); }
      if (a === 'play') {
        if (timer) { stop(); return; }
        if (i >= steps.length - 1) api.go(0);
        b.innerHTML = App.icon('pause', 16) + 'Pause';
        timer = setInterval(() => { const st = steps[i]; if (i >= steps.length - 1 || (st.gate && !st.resolved)) { stop(); return; } api.next(); }, 1500);
      }
    });
    draw();
    return api;
  };

      body: `
        <h2>Beaconing</h2>
        <p>Once malware is installed, it usually calls out to a <strong>command-and-control (C2)</strong> server to ask for instructions. It can’t stay silent, and it can’t hold a connection open without being obvious, so it checks in at intervals: every 60 seconds, every 5 minutes, every hour. That regular heartbeat is a <strong>beacon</strong>, and its rhythm is what gives it away.</p>
        <h2>Finding the rhythm</h2>
        <p>People generate irregular traffic: you load a page, read for a while, click again. A beacon connects like a metronome. If you measure the time between each connection to a destination and those gaps are nearly identical, that regularity is suspicious no matter how normal the address looks. Tools like <strong>RITA</strong> and <strong>Zeek</strong> score every destination this way, and <strong>Arkime</strong> or <strong>Wireshark</strong> let you inspect the packets.</p>
        <h2>Jitter and other evasions</h2>
        <p>Attackers know this, so modern frameworks add <strong>jitter</strong>, a random wobble to each interval. Turn the jitter up in the lab and watch the beacon’s regularity score fall toward the noise. Defenders respond by watching over long windows, since even jittered beacons cluster around an average, and by adding other signals: a tiny, constant request size, a newly registered domain, connections at 3 a.m., or far more bytes going out than coming in.</p>
        <h2>Beacons hide in normal-looking traffic</h2>
        <p>C2 rarely looks exotic. It often rides HTTPS to a plausible domain, or hides in DNS queries, precisely because that traffic is allowed out and rarely inspected. That’s why timing analysis matters: it works on the pattern of the connections, not their contents, so it sees through encryption.</p>`,
      notes: [['Beacon', 'A regular check-in from malware to its C2 server.'], ['Jitter', 'Random wobble added to intervals to defeat timing analysis.'], ['RITA / Zeek', 'Tools that score destinations for beacon-like regularity.'], ['Long windows', 'Watching for hours defeats jitter, because the average still shows.']],
      takeaways: [
        'Malware beacons to C2 on a schedule, and the regular rhythm is the tell.',
        'Jitter blurs the interval, so analysts watch over long windows and add other signals.',
        'Timing analysis works on connection patterns, so it sees through encryption.'
      ]
    });
    const DEST = [
      { host: 'edge-cdn.example-updates.com', mean: 3.5, jitterMul: 1, n: 120, kind: 'browsing', ev: 'A CDN behind normal web browsing. Bursty and irregular.' },
      { host: 'teams.microsoft.example', mean: 20, jitterMul: 0.7, n: 40, kind: 'app', ev: 'A chat app polling for messages. Fairly regular, but a known service.' },
      { host: 'mail.northwind.example', mean: 60, jitterMul: 0.9, n: 22, kind: 'app', ev: 'Mail client checking for new messages.' },
      { host: 'cdn77-assets.example.net', mean: 8, jitterMul: 1, n: 70, kind: 'browsing', ev: 'Static assets loading as the user browses.' },
      { host: 'sync.winupdate-telemetry.top', mean: 45, jitterMul: 0.05, n: 30, kind: 'c2', ev: 'The beacon. A newly registered .top domain, contacted like clockwork every 45 seconds, tiny identical requests. This is the C2 channel rv.exe opened.' }

    function connections(d) {
      let rng = (() => { let x = d.host.length * 7919; return () => { x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; }; })();
      const out = []; let t = rng() * d.mean;
      const jf = (jitter / 100) * d.jitterMul;
      for (let i = 0; i < d.n; i++) { out.push(t); t += d.mean * (1 + (rng() * 2 - 1) * (d.kind === 'browsing' ? 0.9 : jf)); }

    }
    function regularity(times) {
      const gaps = times.slice(1).map((t, i) => t - times[i]);
      if (gaps.length < 3) return 0;
      const mean = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const sd = Math.sqrt(gaps.reduce((a, b) => a + (b - mean) ** 2, 0) / gaps.length);
      const cv = sd / mean; // low = regular
      return Math.round(Math.max(0, Math.min(99, 100 * (1 - cv))));

        <h2>Anchor, then expand</h2>
        <p>You rarely timeline the whole disk at once, because it produces millions of rows. Analysts anchor on a known time, such as the RDP login here, then expand outward, pulling in the minutes before and after from each source. The color tags on the left map each step to a stage of the intrusion, roughly the phases of <strong>MITRE ATT&amp;CK</strong>: initial access, execution, privilege escalation, defense evasion, persistence, command-and-control, exfiltration.</p>

    ['$STANDARD_INFORMATION ($SI)', 'The NTFS attribute holding the MACB timestamps that Explorer shows and most tools update.', 'disk/timestamps'],
    ['Super timeline', 'A merged timeline of every timestamped artifact from all sources, built by Plaso.', 'live/timeline'],
    ['Timestomping', 'Altering a file’s timestamps to hide activity. MITRE ATT&CK T1070.006.', 'disk/timestamps'],
    ['TRIM', 'An SSD command that erases freed blocks, often making deleted data unrecoverable.', 'disk/deleted'],
    ['UserAssist', 'Registry data recording programs a user launched through the Windows interface, with counts.', 'disk/execution'],
    ['Volatility', 'The standard open-source framework for analyzing memory images.', 'live/memory'],
    ['Write blocker', 'Hardware that allows reads but blocks writes to a suspect drive during acquisition.', 'foundations/imaging']
  ];
  App.route('/glossary', function (view) {
    view.appendChild(h(`
      <div class="page">
        <header class="lesson-head"><h1>Glossary</h1><p class="lede">Every term used in the labs, in plain words, with a link to the lesson that teaches it.</p></header>
        <div class="gl-bar"><div class="gl-search">${icon('search', 18)}<input type="search" placeholder="Search terms" aria-label="Search the glossary"></div>${App.seg('gtrack', [['all', 'All'], ['foundations', 'Foundations'], ['disk', 'Disk'], ['live', 'Live']], 'all', 'Filter by track')}</div>
        <dl class="gloss"></dl>
      </div>`));
    let q = '', tr = 'all';
    const dl = $('.gloss', view);
    function render() {
      const items = G.filter(([t, d, l]) => (tr === 'all' || l.startsWith(tr)) && (t + ' ' + d).toLowerCase().includes(q));
      dl.innerHTML = items.length ? items.map(([t, d, l]) => { const [tk, id] = l.split('/'); const les = App.track(tk).lessons.find((x) => x.id === id); return `<div class="gl"><dt>${t}</dt><dd><p>${d}</p><a href="#/${l}">${App.track(tk).name}: ${les.short}</a></dd></div>`; }).join('') : `<div class="callout">No terms match “${esc(q)}”.</div>`;
    }
    $('input', view).addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); render(); });
    App.bindSeg(view, 'gtrack', (v) => { tr = v; render(); });
    render();
  });

  /* =====================================================================
     Watch and read
     ===================================================================== */
  const VIDEOS = [
    { url: 'https://www.youtube.com/watch?v=VYROU-ZwZX8', ch: '13Cubed', t: 'Introduction to Windows Forensics', d: 'A clear, hands-on walkthrough of the core Windows artifacts. Pairs with the whole Disk and files track.' },
    { url: 'https://www.youtube.com/@13Cubed', ch: '13Cubed', t: '13Cubed channel', d: 'Short, focused episodes on Prefetch, memory, event logs and more. The best free DFIR series to work through.' },
    { url: 'https://www.youtube.com/@SANSForensics', ch: 'SANS DFIR', t: 'SANS Digital Forensics and Incident Response', d: 'Conference talks and webcasts across the whole field, from memory forensics to timeline analysis.' },
    { url: 'https://www.youtube.com/watch?v=3xAEsDT-4NA', ch: 'SANS DFIR', t: 'Memory Forensics for Incident Response', d: 'A deeper session on RAM analysis. Watch after the memory lab.' }
  ];
  const READS = [
    { url: 'https://csrc.nist.gov/pubs/sp/800/61/r3/final', t: 'NIST SP 800-61 Rev. 3', d: 'The 2025 incident response guidance, mapped to CSF 2.0. Free PDF.', lab: 'foundations/lifecycle' },
    { url: 'https://www.rfc-editor.org/rfc/rfc3227', t: 'RFC 3227', d: 'Guidelines for Evidence Collection and Archiving, the source of the order of volatility.', lab: 'foundations/volatility' },
    { url: 'https://www.sans.org/posters/windows-forensic-analysis/', t: 'SANS Windows Forensic Analysis poster', d: 'The one-page reference for Windows artifacts and time rules that many analysts keep on the wall.', lab: 'disk/timestamps' },
    { url: 'https://attack.mitre.org/', t: 'MITRE ATT&CK', d: 'The catalog of attacker tactics and techniques the timeline stages map onto.', lab: 'live/timeline' },
    { url: 'https://ericzimmerman.github.io/', t: 'Eric Zimmerman’s tools', d: 'Free download page for PECmd, Registry Explorer, Timeline Explorer and the rest.', lab: 'disk/execution' },
    { url: 'https://dfirdiva.com/', t: 'DFIR Diva', d: 'A curated hub of free training, from someone who catalogs it for newcomers.', lab: 'foundations/lifecycle' }
  ];
  App.route('/watch', function (view) {
    view.appendChild(h(`
      <div class="page">
        <header class="lesson-head"><h1>Watch and read</h1><p class="lede">The best free places to go deeper. Videos to watch alongside the labs, and the standards and references investigators actually work from. Everything opens in a new tab.</p></header>
        <section class="section" style="margin-top:8px"><div class="section-head"><h2>Watch</h2></div>
          <div class="videos">${VIDEOS.map((v) => App.videoCard(v.url, v.t, `${v.ch} — ${v.d}`)).join('')}</div>
        </section>
        <section class="section"><div class="section-head"><h2>Read</h2><p>Primary sources. Prefer these to summaries when you want the exact wording.</p></div>
          <div class="reads">${READS.map((r) => { const [tk, id] = r.lab.split('/'); const les = App.track(tk).lessons.find((x) => x.id === id); return `<a class="read-card" href="${r.url}" target="_blank" rel="noopener noreferrer"><div class="read-top"><b>${esc(r.t)}</b>${icon('ext', 15)}</div><p>${esc(r.d)}</p><span class="read-lab">${les.short}</span></a>`; }).join('')}</div>
        </section>
        <p class="muted small" style="margin-top:32px">Links to third-party sites. They may have changed since this was built.</p>
      </div>`));
  });
})();


App.start();

</script>
